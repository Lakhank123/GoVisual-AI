version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: govisual-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - PORT=8000
    env_file:
      - ./backend/.env
    volumes:
      - backend-generated-images:/app/generated_images
      - backend-generated-videos:/app/generated_videos

volumes:
  backend-generated-images:
  backend-generated-videos:
